name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Test + Content QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: SEO QA
        run: npm run seo:qa

      # These two are part of `npm run release:gate` but were missing from CI,
      # so template and cannibalisation regressions could reach main unseen.
      - name: Content template QA
        run: npm run template:qa

      - name: Intent ownership QA
        run: npm run intent:qa

  deploy:
    name: Deploy to production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # build + 120s health wait + potential rollback rebuild needs headroom
          command_timeout: 15m
          script: |
            cd /var/www/titlecaseconverter
            git pull origin main
            bash scripts/deploy.sh

      - name: Post-deploy smoke tests
        run: |
          sleep 5
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$1")
            if [ "$code" != "200" ]; then
              echo "FAIL: $1 returned $code"
              exit 1
            fi
            echo "OK: $1 ($code)"
          }
          # An unknown slug must be rejected, not answered. Reading searchParams
          # in a page silently opts its route out of static generation, which
          # turns `dynamicParams = false` into a no-op and lets junk URLs return
          # 200. Only a negative-path check catches that regression.
          expect_404() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$1")
            if [ "$code" != "404" ]; then
              echo "FAIL: $1 returned $code, expected 404 (soft-404 regression)"
              exit 1
            fi
            echo "OK: $1 ($code)"
          }
          check https://titlecaseconverter.online/
          check https://titlecaseconverter.online/blog
          check https://titlecaseconverter.online/sentence-case-converter
          check https://titlecaseconverter.online/sitemap.xml
          expect_404 https://titlecaseconverter.online/blog/ci-soft-404-probe-does-not-exist
          expect_404 https://titlecaseconverter.online/ci-soft-404-probe-does-not-exist
          curl -s --max-time 15 https://titlecaseconverter.online/ | grep -qi "converter" \
            || { echo "FAIL: homepage content check"; exit 1; }
          echo "All smoke tests passed"
