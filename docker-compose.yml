services:
  titlecaseconverter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titlecaseconverter
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Guardrails for the 4 GB CPX22 VPS: keep the app from starving nginx/system
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
