# Catch-all for any host name that is not ours. Another site's DNS still
# points at this server's IP (syltfahrradverleih.com and every subdomain,
# found 26.10.2026), and without a default server nginx handed those
# requests to the first block below, which redirected them to
# titlecaseconverter.online. Close the connection instead.
#
# Enabled as its own file so titlecaseconverter.conf stays as Certbot left it:
#   /etc/nginx/sites-enabled/00-default.conf -> ../sites-available/00-default.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
