# Redirect www to apex
server {
    listen 80;
    listen [::]:80;
    server_name www.titlecaseconverter.online;
    return 308 https://titlecaseconverter.online$request_uri;
}

# Main server block
server {
    listen 80;
    listen [::]:80;
    server_name titlecaseconverter.online;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (will be active after SSL setup)
    location / {
        return 301 https://$host$request_uri;
    }
}

