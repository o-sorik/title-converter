# HTTP to HTTPS redirect (all traffic)
server {
    listen 80;
    listen [::]:80;
    server_name titlecaseconverter.online www.titlecaseconverter.online;

    # Certbot challenge (needed for SSL renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://titlecaseconverter.online$request_uri;
    }
}

# HTTPS www → apex redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.titlecaseconverter.online;

    ssl_certificate /etc/letsencrypt/live/titlecaseconverter.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titlecaseconverter.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://titlecaseconverter.online$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name titlecaseconverter.online;

    ssl_certificate /etc/letsencrypt/live/titlecaseconverter.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titlecaseconverter.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Proxy to Next.js container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets (1 year, immutable)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
